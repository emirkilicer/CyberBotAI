{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-black border-secondary p-4 rounded-0 text-center" style="width: 100%; max-width: 440px; border-width: 2px;">
        <h2 class="mb-3" style="letter-spacing: 3px; font-weight: 200;">PASSWORD UPDATED</h2>
        <p class="text-secondary small mb-4">
            Your password has been changed. Sign in with the new password and your
            authenticator code.
        </p>
        <a href="{% url 'login' %}" class="btn btn-light w-100 rounded-0">SIGN IN</a>
    </div>
</div>
{% endblock content %}
