{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-black border-secondary p-4 rounded-0 text-center" style="width: 100%; max-width: 440px; border-width: 2px;">
        <h2 class="mb-3" style="letter-spacing: 3px; font-weight: 200;">CHECK YOUR EMAIL</h2>
        <p class="text-secondary small mb-4">
            If an account exists for that address, a password reset link is on its way.
            The link expires in one hour.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-light w-100 rounded-0">BACK TO LOGIN</a>
    </div>
</div>
{% endblock content %}
