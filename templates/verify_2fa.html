{% extends 'base.html' %}
{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-black border-secondary p-4 rounded-0 text-center" style="width: 100%; max-width: 400px; border-width: 2px;">
        <h2 class="mb-3" style="letter-spacing: 3px; font-weight: 200;">SECURITY GATE</h2>
        <p class="text-secondary small mb-4">Please enter the 6-digit code from your Authenticator app.</p>

        {% if error %}
            <div class="alert alert-danger p-2 small rounded-0 border-danger bg-transparent text-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="otp_code" class="form-control bg-transparent text-white border-secondary rounded-0 text-center" 
                       placeholder="------" maxlength="6" required 
                       style="letter-spacing: 15px; font-size: 1.5rem;">
            </div>
            <button type="submit" class="btn btn-light w-100 rounded-0 mt-2">VERIFY</button>
        </form>

        <details class="mt-4 text-start">
            <summary class="text-secondary small" style="cursor: pointer;">Use a recovery code</summary>
            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="mb-2">
                    <input type="text" name="recovery_code" class="form-control bg-transparent text-white border-secondary rounded-0 text-center"
                           placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required autocomplete="off"
                           style="letter-spacing: 2px;">
                </div>
                <button type="submit" class="btn btn-outline-warning w-100 rounded-0">VERIFY RECOVERY CODE</button>
            </form>
        </details>
    </div>
</div>
{% endblock content %}
