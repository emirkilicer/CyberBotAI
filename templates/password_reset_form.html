{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-black border-secondary p-4 rounded-0" style="width: 100%; max-width: 400px; border-width: 2px;">
        <h2 class="text-center mb-4" style="letter-spacing: 3px; font-weight: 200;">RESET PASSWORD</h2>
        <p class="text-secondary small mb-4">
            Enter the email address on your account. If it exists, we will send a
            single-use reset link. You will still need your 2FA code to sign in.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small text-secondary">Email</label>
                <input type="email" name="email" required autocomplete="email"
                       class="form-control bg-transparent text-white border-secondary rounded-0">
            </div>
            <button type="submit" class="btn btn-light w-100 rounded-0">SEND RESET LINK</button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="small text-secondary">Back to login</a>
        </div>
    </div>
</div>
{% endblock content %}
